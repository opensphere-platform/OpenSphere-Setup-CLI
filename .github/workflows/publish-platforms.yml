name: Publish public platform Setup CLI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Public release tag, for example setup-v0.5.0-edge.20
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: public-platform-setup-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}/${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows
            architecture: amd64
            pwsh_asset: PowerShell-7.6.4-win-x64.zip
            kubectl_os: windows
            kubectl_arch: amd64
            archive: opensphere-setup-windows-amd64.zip
          - runner: ubuntu-24.04
            platform: linux
            architecture: amd64
            pwsh_asset: powershell-7.6.4-linux-x64.tar.gz
            kubectl_os: linux
            kubectl_arch: amd64
            archive: opensphere-setup-linux-amd64.tar.gz
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
            pwsh_asset: powershell-7.6.4-linux-arm64.tar.gz
            kubectl_os: linux
            kubectl_arch: arm64
            archive: opensphere-setup-linux-arm64.tar.gz
          - runner: macos-15-intel
            platform: darwin
            architecture: amd64
            pwsh_asset: powershell-7.6.4-osx-x64.tar.gz
            kubectl_os: darwin
            kubectl_arch: amd64
            archive: opensphere-setup-darwin-amd64.tar.gz
          - runner: macos-14
            platform: darwin
            architecture: arm64
            pwsh_asset: powershell-7.6.4-osx-arm64.tar.gz
            kubectl_os: darwin
            kubectl_arch: arm64
            archive: opensphere-setup-darwin-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      NODE_RELEASE: 26.5.0
      POWERSHELL_RELEASE: 7.6.4
      KUBECTL_RELEASE: v1.36.3
      OPENSPHERE_CONSOLE_SOURCE: ${{ github.workspace }}/_fixtures/OpenSphere-console
    steps:
      - uses: actions/checkout@v4

      - name: Require canonical Setup main release source
        shell: pwsh
        env:
          BOUND_REF: ${{ github.ref }}
          BOUND_SHA: ${{ github.sha }}
        run: |
          if ($env:BOUND_REF -ne 'refs/heads/main') {
            throw "Setup publication requires refs/heads/main, got $env:BOUND_REF"
          }
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:BOUND_SHA) {
            throw 'Checked-out Setup HEAD differs from the workflow source revision'
          }
          git fetch --prune --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch canonical Setup origin/main' }
          $originMain = (git rev-parse refs/remotes/origin/main).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $originMain) {
            throw 'Setup publication requires fresh canonical origin/main'
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - uses: actions/setup-go@v5
        if: matrix.platform == 'windows'
        with:
          go-version: '1.27.0'
          cache: false

      - name: Resolve governed Console source
        id: console_source
        shell: pwsh
        run: |
          $source = node scripts/resolve-console-source-lock.mjs | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Console source lock resolution failed' }
          "repository=$($source.githubRepository)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "revision=$($source.revision)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout canonical Console manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.console_source.outputs.repository }}
          ref: ${{ steps.console_source.outputs.revision }}
          fetch-depth: 0
          path: _fixtures/OpenSphere-console
          persist-credentials: false

      - name: Verify governed Console checkout
        shell: pwsh
        run: |
          node scripts/verify-console-source-checkout.mjs `
            --checkout '_fixtures/OpenSphere-console' `
            --current-only
          if ($LASTEXITCODE -ne 0) { throw 'Console source checkout verification failed' }

      - name: Require public distribution
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $visibility = gh api "repos/$env:GITHUB_REPOSITORY" --jq .visibility
          if ($visibility -ne 'public') { throw "Refusing non-public Setup distribution: $visibility" }

      - name: Require declared Setup CLI channel pointer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $version = node -p "require('./package.json').version"
          $channel = if ($version -match '-edge[.][0-9]+$') {
            'edge'
          } elseif ($version -match '-candidate[.][0-9]+$') {
            'candidate'
          } elseif ($version -match '^[0-9]+[.][0-9]+[.][0-9]+$') {
            'stable'
          } else {
            throw "Package version has no supported Setup CLI channel: $version"
          }
          $pointer = (Get-Content -LiteralPath "channels/$channel" -Raw).Trim()
          if ($pointer -ne $env:RELEASE_TAG) {
            throw "Setup CLI channel $channel points to $pointer, expected $env:RELEASE_TAG"
          }
          $expectedPrerelease = $channel -ne 'stable'
          if ([bool]::Parse($env:IS_PRERELEASE) -ne $expectedPrerelease) {
            throw "Setup CLI channel $channel prerelease flag must be $expectedPrerelease"
          }
          if ($channel -ne 'edge') {
            throw 'candidate/stable Setup publication remains on HOLD until trusted Windows Authenticode and Apple notarization gates are implemented.'
          }

      - name: Require registered OpenSphere OAuth app
        shell: pwsh
        run: |
          node scripts/verify-oauth-app.mjs
          if ($LASTEXITCODE -ne 0) { throw 'OpenSphere OAuth App must be configured before public release' }

      - name: Install and test
        shell: pwsh
        run: |
          npm ci
          npm test

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_RELEASE }}

      - name: Bundle and build native SEA
        shell: pwsh
        run: |
          npm run build:bundle
          New-Item -ItemType Directory -Force .release/sea | Out-Null
          $extension = if ('${{ matrix.platform }}' -eq 'windows') { '.exe' } else { '' }
          node scripts/build-linux-sea.mjs `
            --node-executable (node -p "process.execPath") `
            --output ".release/sea/opensphere-setup$extension"
          if ('${{ matrix.platform }}' -eq 'darwin') {
            codesign --force --sign - .release/sea/opensphere-setup
            codesign --verify --strict --verbose=4 .release/sea/opensphere-setup
          }

      - name: Download and verify bundled PowerShell
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .release/pwsh | Out-Null
          $asset = '${{ matrix.pwsh_asset }}'
          $base = "https://github.com/PowerShell/PowerShell/releases/download/v$env:POWERSHELL_RELEASE"
          Invoke-WebRequest "$base/$asset" -OutFile ".release/$asset"
          Invoke-WebRequest "$base/hashes.sha256" -OutFile .release/powershell-hashes.sha256
          $line = Get-Content .release/powershell-hashes.sha256 | Where-Object { $_ -match [regex]::Escape($asset) } | Select-Object -First 1
          if (-not $line) { throw "PowerShell checksum missing for $asset" }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash ".release/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "PowerShell checksum mismatch" }
          if ($asset.EndsWith('.zip')) {
            Expand-Archive ".release/$asset" .release/pwsh
          } else {
            tar -xzf ".release/$asset" -C .release/pwsh
          }

      - name: Download and verify bundled kubectl
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .release/tools | Out-Null
          $name = if ('${{ matrix.platform }}' -eq 'windows') { 'kubectl.exe' } else { 'kubectl' }
          $url = "https://dl.k8s.io/release/$env:KUBECTL_RELEASE/bin/${{ matrix.kubectl_os }}/${{ matrix.kubectl_arch }}/$name"
          Invoke-WebRequest $url -OutFile ".release/tools/$name"
          $expected = (Invoke-WebRequest "$url.sha256").Content.Trim().ToLowerInvariant()
          $actual = (Get-FileHash ".release/tools/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "kubectl checksum mismatch" }

      - name: Acquire Linux libatomic runtime
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release/libatomic
          docker run --rm \
            -v "$PWD/.release/libatomic:/out" \
            debian:bookworm-slim \
            sh -ec 'apt-get update >/dev/null; cd /out; apt-get download libatomic1 >/dev/null; dpkg-deb -x ./*.deb extracted'
          library="$(find .release/libatomic/extracted -type f -name 'libatomic.so.1.*' -print -quit)"
          test -n "$library"
          cp "$library" .release/libatomic/libatomic.so.1

      - name: Package self-contained runtime
        shell: pwsh
        run: |
          $extension = if ('${{ matrix.platform }}' -eq 'windows') { '.exe' } else { '' }
          $kubectl = if ('${{ matrix.platform }}' -eq 'windows') { '.release/tools/kubectl.exe' } else { '.release/tools/kubectl' }
          $arguments = @(
            'scripts/package-portable-runtime.mjs',
            '--sea', ".release/sea/opensphere-setup$extension",
            '--pwsh-directory', '.release/pwsh',
            '--kubectl', $kubectl,
            '--platform', '${{ matrix.platform }}',
            '--architecture', '${{ matrix.architecture }}',
            '--version', (node -p "require('./package.json').version"),
            '--node-executable', (node -p "process.execPath"),
            '--bundle', '.release/bundle/index.mjs',
            '--runtime-assets', 'src',
            '--output', "dist/${{ matrix.archive }}"
          )
          if ('${{ matrix.platform }}' -eq 'linux') {
            $arguments += @('--libatomic', '.release/libatomic/libatomic.so.1')
          }
          node @arguments

      - name: Smoke-test packaged runtime
        shell: pwsh
        run: |
          $platform = '${{ matrix.platform }}'
          $architecture = '${{ matrix.architecture }}'
          $archive = "dist/${{ matrix.archive }}"
          $smoke = '.release/smoke'
          New-Item -ItemType Directory -Force $smoke | Out-Null
          if ($platform -eq 'windows') {
            Expand-Archive $archive $smoke
          } else {
            tar -xzf $archive -C $smoke
          }
          $root = Join-Path $smoke "opensphere-setup-$platform-$architecture"
          $setup = Join-Path $root $(if ($platform -eq 'windows') { 'opensphere-setup.exe' } else { 'opensphere-setup' })
          $pwsh = Join-Path $root "runtime/pwsh/$(if ($platform -eq 'windows') { 'pwsh.exe' } else { 'pwsh' })"
          $kubectl = Join-Path $root "runtime/bin/$(if ($platform -eq 'windows') { 'kubectl.exe' } else { 'kubectl' })"
          $packageVersion = node -p "require('./package.json').version"
          $expected = "opensphere-setup $packageVersion"
          if ($platform -eq 'darwin' -and $architecture -eq 'arm64') {
            codesign --verify --strict --verbose=4 $setup
          } elseif ($platform -eq 'darwin') {
            codesign --verify --strict --verbose=4 (Join-Path $root 'runtime/bin/node')
          }
          $actual = & $setup version
          $setupExitCode = $LASTEXITCODE
          if ($setupExitCode -ne 0 -or $actual -ne $expected) {
            throw "Setup smoke test failed with exit code ${setupExitCode}: $actual (expected $expected)"
          }
          & $pwsh -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { throw 'Bundled PowerShell smoke test failed' }
          & $kubectl version --client -o json
          if ($LASTEXITCODE -ne 0) { throw 'Bundled kubectl smoke test failed' }

      - name: Build Windows portable launcher
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = node -p "require('./package.json').version"
          $expectedTag = "setup-v$version"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag must equal package version: $expectedTag"
          }
          go test ./launchers/windows
          if ($LASTEXITCODE -ne 0) { throw 'Portable launcher tests failed' }
          go build -trimpath `
            -ldflags "-s -w -X main.releaseTag=$env:RELEASE_TAG" `
            -o dist/opensphere-setup.exe `
            ./launchers/windows
          if ($LASTEXITCODE -ne 0) { throw 'Portable launcher build failed' }
          $boundTag = (& dist/opensphere-setup.exe --bootstrap-version).Trim()
          if ($LASTEXITCODE -ne 0 -or $boundTag -ne $expectedTag) {
            throw "Windows portable launcher release binding failed: $boundTag"
          }

      - name: Upload platform archive
        uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows portable launcher
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: setup-windows-launcher
          path: dist/opensphere-setup.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      IS_PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: setup-*
          path: dist
          merge-multiple: true

      - name: Validate release input and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected="setup-v$version"
          test "$RELEASE_TAG" = "$expected"
          cd dist
          sha256sum opensphere-setup-* opensphere-setup.exe > SHA256SUMS
          test "$(find . -maxdepth 1 -type f -name 'opensphere-setup-*' | wc -l)" -eq 5
          test -s opensphere-setup.exe

      - name: Publish public GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "$RELEASE_TAG"
            dist/opensphere-setup-*
            dist/opensphere-setup.exe
            dist/SHA256SUMS
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "OpenSphere Setup CLI ${RELEASE_TAG#setup-v}"
            --notes-file docs/PLATFORM-RELEASE-NOTES.md
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"

      - name: Validate immutable release and asset digests
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r '.immutable' <<<"$release")" = "true"
          for file in dist/opensphere-setup-* dist/opensphere-setup.exe dist/SHA256SUMS; do
            name="$(basename "$file")"
            local_digest="sha256:$(sha256sum "$file" | awk '{print $1}')"
            remote_digest="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<<"$release")"
            test -n "$remote_digest"
            test "$local_digest" = "$remote_digest"
          done
