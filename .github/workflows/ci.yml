name: Setup CLI CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  attestations: read
  packages: read

jobs:
  test:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OPENSPHERE_CONSOLE_SOURCE: ${{ github.workspace }}/_fixtures/OpenSphere-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve governed Console source
        id: console_source
        shell: pwsh
        run: |
          $source = node scripts/resolve-console-source-lock.mjs | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Console source lock resolution failed' }
          "repository=$($source.githubRepository)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "revision=$($source.revision)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Materialize previous Console source lock
        id: previous_console_source
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if (-not $env:BASE_SHA) {
            "mode=current-only" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          git fetch --no-tags origin $env:BASE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch the pull request base revision' }
          $raw = git show "$env:BASE_SHA`:console-source.lock.json" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $path = Join-Path $env:RUNNER_TEMP 'previous-console-source.lock.json'
            [System.IO.File]::WriteAllText($path, ($raw -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
            "mode=previous" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } elseif ($LASTEXITCODE -eq 128) {
            "mode=bootstrap" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            throw 'Failed to inspect the previous Console source lock'
          }
      - name: Checkout canonical Console manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.console_source.outputs.repository }}
          ref: ${{ steps.console_source.outputs.revision }}
          fetch-depth: 0
          path: _fixtures/OpenSphere-console
      - name: Verify governed Console checkout
        shell: pwsh
        run: |
          $arguments = @('--checkout', '_fixtures/OpenSphere-console')
          if ('${{ steps.previous_console_source.outputs.mode }}' -eq 'previous') {
            $arguments += @('--previous-lock', '${{ steps.previous_console_source.outputs.path }}')
          } elseif ('${{ steps.previous_console_source.outputs.mode }}' -eq 'bootstrap') {
            $arguments += '--allow-bootstrap'
          } else {
            $arguments += '--current-only'
          }
          node scripts/verify-console-source-checkout.mjs @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Console source checkout verification failed' }
      - name: Install and smoke-test canonical Setup command
        shell: pwsh
        run: |
          ./Install-OpenSphereSetup.ps1
          $version = opensphere-setup version
          $packageVersion = node -p "require('./package.json').version"
          $expected = "opensphere-setup $packageVersion"
          if ($version -ne $expected) { throw "Unexpected command version: $version (expected $expected)" }
      - name: Contract tests
        run: npm test
      - name: Source and E2E harness syntax
        shell: pwsh
        run: |
          Get-ChildItem src/*.mjs | ForEach-Object { node --check $_.FullName }
          node --check scripts/e2e-resolve-source-revision.mjs
          node --check scripts/e2e-first-admin.mjs
          [void][scriptblock]::Create((Get-Content -Raw src/Install-LocalDevelopmentCa.ps1))
          [void][scriptblock]::Create((Get-Content -Raw scripts/e2e-clean-install.ps1))
      # candidate/stable must remain unavailable or fail closed until an
      # explicit promotion publishes a complete dual-architecture release.
      # Requiring their resolution here would incorrectly turn the current
      # promotion HOLD into a CI failure of the edge installer.
      - name: Live edge channel resolution contract
        shell: pwsh
        run: |
          node src/cli.mjs resolve --release edge --lock "$env:RUNNER_TEMP/edge-lock.json"
          if ($LASTEXITCODE -ne 0) { throw 'edge channel resolution failed' }
      - name: Certificate generator smoke test
        shell: pwsh
        run: |
          ./src/New-Certificates.ps1 -OutputDirectory "$env:RUNNER_TEMP/certs"
          if (-not (Test-Path "$env:RUNNER_TEMP/certs/tls.crt")) { throw 'tls.crt missing' }
          if (-not (Test-Path "$env:RUNNER_TEMP/certs/tls.key")) { throw 'tls.key missing' }
          if (-not (Test-Path "$env:RUNNER_TEMP/certs/sig.key")) { throw 'sig.key missing' }

  clean-kubernetes-edge:
    # This is deliberately not docker-desktop. It proves that Setup's embedded
    # Service port-forward path completes bootstrap, verification and CLI
    # installation before a public Console ingress/DNS endpoint exists.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install canonical Setup command
        run: npm install --global . --no-audit --no-fund
      - uses: helm/kind-action@v1.14.0
        with:
          cluster_name: opensphere-e2e
          kubectl_version: v1.36.1
      - name: Install disposable dynamic storage
        run: |
          kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.32/deploy/local-path-storage.yaml
          kubectl -n local-path-storage wait --for=condition=Available deployment/local-path-provisioner --timeout=180s
      - name: Resolve, bootstrap and verify a clean edge installation
        env:
          OPENSPHERE_OS_INSTALL_DIR: ${{ runner.temp }}/opensphere-bin
        run: |
          set -euo pipefail
          opensphere-setup resolve --release edge --lock "$RUNNER_TEMP/edge-release-lock.json"
          opensphere-setup bootstrap --release edge --lock "$RUNNER_TEMP/edge-release-lock.json" \
            --context kind-opensphere-e2e --storage-class local-path \
            --console https://localhost:18090 \
            --auth-environment development \
            --admin-username e2e-admin \
            --admin-display-name 'OpenSphere E2E Administrator' \
            --admin-email e2e-admin@opensphere.local \
            --no-open-browser
          opensphere-setup verify --context kind-opensphere-e2e --console https://localhost:18090 --require-zero-restarts
          kubectl --context kind-opensphere-e2e -n opensphere-console port-forward \
            svc/opensphere-console-ext 18090:https --address 127.0.0.1 \
            >"$RUNNER_TEMP/console-port-forward.log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --insecure --fail \
              https://localhost:18090/api/identity/bootstrap/status >/dev/null; then
              break
            fi
            if ! kill -0 "$port_forward_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/console-port-forward.log"
              exit 1
            fi
            if test "$attempt" = 60; then
              cat "$RUNNER_TEMP/console-port-forward.log"
              exit 1
            fi
            sleep 2
          done
          OPENSPHERE_E2E_CONSOLE=https://localhost:18090 node scripts/e2e-first-admin.mjs
          opensphere-setup verify --context kind-opensphere-e2e --console https://localhost:18090 --require-zero-restarts
          test -x "$RUNNER_TEMP/opensphere-bin/os"
          "$RUNNER_TEMP/opensphere-bin/os" --version
      - name: Collect redacted audit evidence
        if: always()
        run: bash scripts/collect-audit-evidence.sh kind-opensphere-e2e "$RUNNER_TEMP/audit-evidence"
      - name: Upload redacted audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-evidence-supabase-${{ github.run_id }}
          path: ${{ runner.temp }}/audit-evidence
          if-no-files-found: error
          retention-days: 90
