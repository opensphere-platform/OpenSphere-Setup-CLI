apiVersion: v1
kind: Service
metadata:
  name: opensphere-platform-release-authority
  namespace: opensphere-console
  labels: { app: opensphere-platform-release-authority }
spec:
  selector: { app: opensphere-console-backend }
  ports: [{ name: https, port: 8446, targetPort: release-tls }]
---
# Bootstrap A applies this complete backend-owned manifest through the old
# component selector. This one-shot identity may create only the immutable
# TLS pair and validates/reuses it across response loss or Pod replacement.
apiVersion: v1
kind: ServiceAccount
metadata: { name: platform-release-tls-initializer, namespace: opensphere-console }
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: platform-release-tls-initializer, namespace: opensphere-console }
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["opensphere-platform-release-authority-tls"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["opensphere-platform-release-control-ca"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["opensphere-platform-release-authority"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: platform-release-tls-initializer, namespace: opensphere-console }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-release-tls-initializer }
subjects:
  - { kind: ServiceAccount, name: platform-release-tls-initializer, namespace: opensphere-console }
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: platform-release-tls-initializer-custody }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets", "configmaps", "services"]
  validations:
    - expression: >-
        request.userInfo.username
          != 'system:serviceaccount:opensphere-console:platform-release-tls-initializer'
        || (
          request.operation == 'CREATE'
          && request.namespace == 'opensphere-console'
          && (
            (object.kind == 'Secret'
              && object.metadata.name == 'opensphere-platform-release-authority-tls')
            || (object.kind == 'ConfigMap'
              && object.metadata.name == 'opensphere-platform-release-control-ca')
            || (object.kind == 'Service'
              && object.metadata.name == 'opensphere-platform-release-authority'
              && size(object.metadata.labels) == 1
              && object.metadata.labels['app'] == 'opensphere-platform-release-authority'
              && object.spec.selector == {'app':'opensphere-console-backend'}
              && object.spec.type == 'ClusterIP'
              && (!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0)
              && (!has(object.spec.externalName) || object.spec.externalName == '')
              && !has(object.spec.loadBalancerClass)
              && size(object.spec.ports) == 1
              && object.spec.ports[0].name == 'https'
              && object.spec.ports[0].port == 8446
              && object.spec.ports[0].protocol == 'TCP'
              && object.spec.ports[0].targetPort == 'release-tls'
              && (!has(object.spec.ports[0].appProtocol))
              && (!has(object.spec.ports[0].nodePort) || object.spec.ports[0].nodePort == 0)
              && object.spec.clusterIP != 'None'
              && size(object.spec.clusterIPs) == 1
              && object.spec.clusterIPs[0] == object.spec.clusterIP
              && size(object.spec.ipFamilies) == 1
              && object.spec.ipFamilyPolicy == 'SingleStack'
              && object.spec.internalTrafficPolicy == 'Cluster'
              && object.spec.sessionAffinity == 'None'
              && (!has(object.spec.sessionAffinityConfig))
              && (!has(object.spec.publishNotReadyAddresses)
                || !object.spec.publishNotReadyAddresses)
              && (!has(object.spec.externalTrafficPolicy)
                || object.spec.externalTrafficPolicy == 'Cluster')
              && (!has(object.spec.healthCheckNodePort)
                || object.spec.healthCheckNodePort == 0)
              && (!has(object.spec.loadBalancerIP) || object.spec.loadBalancerIP == ''))
          )
        )
      message: Platform Release TLS initializer may create only its exact authority resources.
---
