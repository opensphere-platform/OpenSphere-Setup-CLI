apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: { name: platform-release-tls-initializer-pod-boundary }
spec:
  policyName: platform-release-tls-initializer-pod-boundary
  paramRef:
    name: opensphere-console-backend
    namespace: opensphere-console
    parameterNotFoundAction: Deny
  validationActions: [Deny]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: opensphere-tls-init-__OPENSPHERE_RELEASE_REVISION__
  namespace: opensphere-console
  labels:
    app: platform-release-tls-initializer
    opensphere.io/source-revision: __OPENSPHERE_RELEASE_REVISION__
spec:
  parallelism: 1
  completions: 1
  completionMode: NonIndexed
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: platform-release-tls-initializer
        opensphere.io/source-revision: __OPENSPHERE_RELEASE_REVISION__
    spec:
      serviceAccountName: platform-release-tls-initializer
      automountServiceAccountToken: false
      restartPolicy: Never
      imagePullSecrets: [{ name: opensphere-ghcr-pull }]
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: initializer
          image: ghcr.io/opensphere-platform/opensphere-console-backend@sha256:8ff3652e8087e57c9e150e1b4a59ac64e19c7330cae6234d454f85075fb42e84
          imagePullPolicy: IfNotPresent
          command: ["node", "/app/opensphere-console-backend/platform-release-tls-initializer.mjs"]
          env:
            - { name: HOME, value: /tmp/home }
            - { name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
            - { name: PLATFORM_RELEASE_TLS_INITIALIZER_PROFILE, value: opensphere-platform-release-tls-initializer/v1 }
          volumeMounts: [{ name: kube-api-access, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }, { name: tmp, mountPath: /tmp }]
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: kube-api-access
          projected:
            defaultMode: 256
            sources:
              - serviceAccountToken: { path: token, audience: "https://kubernetes.default.svc", expirationSeconds: 600 }
              - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
        - { name: tmp, emptyDir: {} }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: platform-release-tls-initializer, namespace: opensphere-console }
spec:
  podSelector: { matchLabels: { app: platform-release-tls-initializer } }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: [{ ipBlock: { cidr: 10.96.0.1/32 } }]
      ports: [{ protocol: TCP, port: 443 }]
