    {
      "apiGroups": [
        "apps"
      ],
      "resources": [
        "deployments/scale",
        "statefulsets/scale",
        "replicasets/scale"
      ],
      "verbs": [
        "get",
        "update",
        "patch"
      ]
    },
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "pods"
      ],
      "verbs": [
        "delete"
      ]
    },
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "pods/eviction"
      ],
      "verbs": [
        "create"
      ]
    },
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "nodes"
      ],
      "verbs": [
        "patch"
      ]
    },
    {
      "apiGroups": [
        "networking.k8s.io"
      ],
      "resources": [
        "ingresses"
      ],
      "verbs": [
        "create",
        "update",
        "patch",
        "delete"
      ]
    }
  ]
}
