# User decision 2026-09-28 ("이 시스템에서 내가 결정해서 못하는 일은 없다"): OpenSphere-, platform- and module-owned
# namespaces and role nodes are the administrator's decision, not forbidden. Cluster Manager runs a decided change
# with its own short TokenRequest credential and writes that change's exact requests to this parameter object
# ("JTI=<credential id>|<operation>|<resource>|<subresource>|<namespace>|<name>|<target UID>|<decided value>", key
# carrying its expiry); the guard admits a protected request only when it is listed for the credential the API server
# authenticated, on the planned object (its UID) and with the decided value (replicas=N, unschedulable=true|false,
# the restart marker, or "-" where the UID alone binds it). An Ingress grant is "ingress:" followed by the approved
# object's items (class, default backend, each rule with its paths, TLS, every annotation and label) separated by
# U+001F; the guard rebuilds them from the admitted object and compares the sets (Codex progress-2 N1), and an
# Ingress with owner labels needs a grant in any namespace (user requirement 2026-09-28: Ingress control). The
# object ships without data: Cluster Manager owns its entries, and the runtime may update only this object.
---
{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "opensphere-cluster-manager-decision-grants",
    "namespace": "opensphere-console",
    "labels": {
      "opensphere.io/managed-by": "opensphere-platform",
      "opensphere.io/installation-profile": "cluster-workload-operations-v1"
    }
  }
}
