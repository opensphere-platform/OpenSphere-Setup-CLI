# Cluster Manager Kubernetes workload operations — 2026-09-27 (user direction). R2D2, OS CLI and the GUI
# restart, scale, delete controller-owned Pods and cordon/uncordon/drain worker nodes only through Cluster
# Manager's reviewed OS Shell commands. The generic /api/k8s proxy and the inventory role stay read-only.
# Codex HOLD 2026-09-28: the write role belongs to its own ServiceAccount, not the runtime that also runs HISS
# and Ceph; the runtime may only request that account's short token, and a fail-closed admission policy on that
# account refuses what the code also refuses (platform/owner namespaces, role nodes, fields other than a node's
# schedulability or a workload's restart marker). KubeVirt power subresources are served by an aggregated API
# that this admission does not reach, so they are not granted.
