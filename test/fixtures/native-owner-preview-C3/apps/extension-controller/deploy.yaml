# User-approved 2026-09-06: reproduce the existing original inventory profile in Setup.
# No Secret access or HISS/Ceph mutation grant; C_EXT gets only the two named RBAC objects.
# Source: Cluster Manager 630914882196a1de7818fd23cc4f7cd84a00c700/deploy/console-runtime-profile.yaml
apiVersion: v1
kind: ServiceAccount
metadata: {name: opensphere-cluster-manager-runtime, namespace: opensphere-console}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opensphere-cluster-manager-runtime
  labels: { opensphere.io/managed-by: opensphere-platform }
rules:
  # Console-side storage integration only. HISS lifecycle is never delegated
  # through a Console module permission profile.
  - { apiGroups: [""], resources: [namespaces, nodes, pods, pods/log, services, endpoints, persistentvolumeclaims, persistentvolumes, events, configmaps, limitranges, resourcequotas, serviceaccounts, replicationcontrollers], verbs: [get, list, watch] }
  - { apiGroups: [apps], resources: [deployments, daemonsets, statefulsets, replicasets, controllerrevisions], verbs: [get, list, watch] }
  - { apiGroups: [batch], resources: [jobs, cronjobs], verbs: [get, list, watch] }
  - { apiGroups: [storage.k8s.io], resources: [storageclasses, csidrivers, csinodes, volumeattachments], verbs: [get, list, watch] }
  - { apiGroups: [networking.k8s.io], resources: [ingresses, networkpolicies, ingressclasses], verbs: [get, list, watch] }
  - { apiGroups: [discovery.k8s.io], resources: [endpointslices], verbs: [get, list, watch] }
  - { apiGroups: [autoscaling], resources: [horizontalpodautoscalers], verbs: [get, list, watch] }
  - { apiGroups: [autoscaling.k8s.io], resources: [verticalpodautoscalers], verbs: [get, list, watch] }
  - { apiGroups: [policy], resources: [poddisruptionbudgets], verbs: [get, list, watch] }
  - { apiGroups: [scheduling.k8s.io], resources: [priorityclasses], verbs: [get, list, watch] }
  - { apiGroups: [node.k8s.io], resources: [runtimeclasses], verbs: [get, list, watch] }
  - { apiGroups: [coordination.k8s.io], resources: [leases], verbs: [get, list, watch] }
  - { apiGroups: [rbac.authorization.k8s.io], resources: [roles, rolebindings, clusterroles, clusterrolebindings], verbs: [get, list, watch] }
  - { apiGroups: [apiextensions.k8s.io], resources: [customresourcedefinitions], verbs: [get, list, watch] }
  - { apiGroups: [metrics.k8s.io], resources: [nodes, pods], verbs: [get, list] }
  - { apiGroups: [jobset.x-k8s.io], resources: [jobsets], verbs: [get, list, watch] }
  - { apiGroups: [cert-manager.io], resources: [issuers, clusterissuers, certificates, certificaterequests], verbs: [get, list, watch] }
  - { apiGroups: [acme.cert-manager.io], resources: [challenges, orders], verbs: [get, list, watch] }
  - apiGroups: [kubevirt.io, subresources.kubevirt.io, cdi.kubevirt.io, instancetype.kubevirt.io, migrations.kubevirt.io, snapshot.storage.k8s.io, forklift.konveyor.io, ceph.rook.io, template.openshift.io, fleet.opensphere.io, cluster.open-cluster-management.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - { nonResourceURLs: [/version, /api, /apis, /apis/*], verbs: [get] }
  - { apiGroups: [authorization.k8s.io], resources: [selfsubjectaccessreviews], verbs: [create] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: opensphere-cluster-manager-runtime}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: opensphere-cluster-manager-runtime}
subjects: [{kind: ServiceAccount, name: opensphere-cluster-manager-runtime, namespace: opensphere-console}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opensphere-extension-installation-profile-reader
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    resourceNames: [opensphere-cluster-manager-runtime, opensphere-platform-support-runtime]
    verbs: [get]
  # The PSSS profile includes its first-delivery admission policy and binding; verify them by name only.
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    resourceNames: [opensphere-psss-first-delivery-projects, opensphere-psss-first-delivery]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opensphere-extension-installation-profile-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opensphere-extension-installation-profile-reader
subjects:
  - kind: ServiceAccount
    name: opensphere-extension-controller
    namespace: opensphere-console
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensphere-cluster-manager
  namespace: opensphere-console
  labels:
    app.kubernetes.io/part-of: opensphere-console
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opensphere-cluster-manager-read
rules:
  - apiGroups: ['']
    resources: [nodes, namespaces, pods, persistentvolumes, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
  - apiGroups: [ceph.rook.io]
    resources: [cephclusters]
    verbs: [get, list]
  - nonResourceURLs: [/version]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opensphere-cluster-manager-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opensphere-cluster-manager-read
subjects:
  - kind: ServiceAccount
    name: opensphere-cluster-manager
    namespace: opensphere-console
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensphere-cluster-manager-ingress
  namespace: opensphere-console
spec:
  podSelector:
    matchLabels:
      opensphere.io/extension-id: cluster-manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opensphere-extension-controller
        # 22 invokes the existing owner API with the current Console user's
        # bearer token. Network reachability does not grant management rights;
        # Cluster Manager revalidates identity, permission and MFA per request.
        - podSelector:
            matchLabels:
              app: opensphere-console-osaa-gateway
        - podSelector:
            matchLabels:
              app: opensphere-shell-api
        # HISS H3: a Provider revision Pod that declares a hiss.* facility reads its own telemetry here. Cluster
        # Manager checks its token, Pod and ObservabilityBinding; the extension controller sets this label.
        - podSelector:
            matchLabels:
              opensphere.io/hiss-consumer: "true"
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensphere-extension-controller
  namespace: opensphere-console
  labels:
    app.kubernetes.io/name: opensphere-extension-controller
    app.kubernetes.io/part-of: opensphere-console
    opensphere.io/component: C_EXT
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensphere-extension-controller
  namespace: opensphere-console
rules:
  # Foundation composition retires an undeclared child Package (rename/rollback) only after its Registration is
  # gone, with uid/resourceVersion preconditions (foundation-composition.mjs retireUndeclaredChildren).
  - apiGroups: [plugins.opensphere.io]
    resources: [uipluginpackages]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [plugins.opensphere.io]
    resources: [uipluginregistrations]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [plugins.opensphere.io]
    resources: [uipluginregistrations/status]
    verbs: [patch]
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [opensphere-extension-trusted-keys]
    verbs: [get]
  # The PSSS profile accepts the previous reviewed delivery policy only while Setup's record shows a transition.
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [opensphere-installation-lock]
    verbs: [get]
  - apiGroups: ['']
    resources: [serviceaccounts, services]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    resourceNames: [opensphere-console-api-kubernetes-egress]
    verbs: [get, patch]
  # Provider self-declaration (M4 2026-10-15): each declared Provider revision gets its own NetworkPolicy, rendered
  # from the signed, approved declarations and owned by its UIPluginPackage (create, revision cleanup, uninstall).
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, patch, delete]
  # Declared Kubernetes identity (user decision 2026-10-15, option A): one Role and RoleBinding per declared namespace
  # for a Provider revision's own ServiceAccount. escalate and bind let the controller grant what the signed, approved,
  # vocabulary-checked declaration names without holding it; they are limited to this namespace and
  # opensphere-foundation (the Role below).
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles]
    verbs: [escalate, bind]
---
