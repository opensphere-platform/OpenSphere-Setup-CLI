{
  "apiVersion": "admissionregistration.k8s.io/v1",
  "kind": "ValidatingAdmissionPolicy",
  "metadata": {
    "name": "opensphere-pfss-argo-controller",
    "labels": {
      "opensphere.io/managed-by": "opensphere-platform",
      "opensphere.io/installation-profile": "platform-support-operations-v1"
    }
  },
  "spec": {
    "failurePolicy": "Fail",
    "matchConstraints": {
      "resourceRules": [
        {
          "apiGroups": [
            "argoproj.io"
          ],
          "apiVersions": [
            "v1alpha1"
          ],
          "operations": [
            "CREATE",
            "UPDATE"
          ],
          "resources": [
            "applications"
          ]
        }
      ]
    },
    "matchConditions": [
      {
        "name": "bounded-runtime-writer",
        "expression": "request.userInfo.username == 'system:serviceaccount:argocd:argocd-application-controller' && (object.metadata.name.startsWith('pfss-') || (request.operation == 'UPDATE' && oldObject.metadata.name.startsWith('pfss-')))"
      }
    ],
    "validations": [
      {
        "expression": "request.operation == 'UPDATE' && request.namespace == 'argocd' && object.spec == oldObject.spec && object.metadata.uid == oldObject.metadata.uid",
        "message": "Argo controller observes and executes existing PFSS Applications; PSSS owns their declarations"
      },
      {
        "expression": "(!has(object.operation)) || (has(oldObject.operation) && object.operation == oldObject.operation)",
        "message": "Argo cannot initiate or replace a PFSS sync operation"
      },
      {
        "expression": "object.metadata.annotations == oldObject.metadata.annotations",
        "message": "Argo cannot replace PFSS operation declaration binding"
      }
    ]
  }
}
