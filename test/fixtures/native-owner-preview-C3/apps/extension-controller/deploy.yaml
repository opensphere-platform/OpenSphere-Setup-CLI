      "opensphere.io/installation-profile": "cluster-workload-operations-v1"
    }
  },
  "rules": [
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "configmaps"
      ],
      "resourceNames": [
        "opensphere-cluster-manager-decision-grants"
      ],
      "verbs": [
        "get",
        "update"
      ]
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "RoleBinding",
  "metadata": {
    "name": "opensphere-cluster-manager-decision-grants",
    "namespace": "opensphere-console",
