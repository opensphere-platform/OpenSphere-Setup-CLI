apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensphere-extension-controller
  namespace: opensphere-console
  labels:
    app.kubernetes.io/name: opensphere-extension-controller
    app.kubernetes.io/part-of: opensphere-console
    opensphere.io/component: C_EXT
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensphere-extension-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensphere-extension-controller
        app.kubernetes.io/part-of: opensphere-console
        opensphere.io/component: C_EXT
    spec:
      serviceAccountName: opensphere-extension-controller
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: opensphere-ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: __OPENSPHERE_EXTENSION_CONTROLLER_IMAGE__
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - { name: module-registry, mountPath: /var/run/opensphere/module-registry, readOnly: true }
            - { name: module-trust, mountPath: /var/run/opensphere/module-trust, readOnly: true }
            - { name: installation-policy, mountPath: /var/run/opensphere/installation, readOnly: true }
            - { name: provider-dispatch, mountPath: /var/run/opensphere/provider-dispatch, readOnly: true }
            - { name: provider-engine, mountPath: /var/run/opensphere/provider-engine, readOnly: true }
            - { name: provider-lifecycle, mountPath: /var/run/opensphere/provider-lifecycle, readOnly: true }
          env:
            # Same placeholder as the image above; Setup fills both from the release lock.
            - name: OPENSPHERE_EXTENSION_CONTROLLER_IMAGE
              value: __OPENSPHERE_EXTENSION_CONTROLLER_IMAGE__
            # Source declaration only: deployment of this Pod identity change still needs review.
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: CONSOLE_EXTENSION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: opensphere-extension-controller-runtime
                  key: database-url
            - name: CONSOLE_REGISTRY_URL
              value: http://opensphere-registry.opensphere-console.svc.cluster.local:8080
            - name: CONSOLE_EXTENSION_NAMESPACE
              value: opensphere-console
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: CONSOLE_EXTENSION_LIFECYCLE_ENABLED
              value: 'true'
            - name: CONSOLE_OWNER_AUTHORITY_URL
              value: http://opensphere-console-api.opensphere-console.svc.cluster.local:8080
            - name: CONSOLE_PROVIDER_DISPATCH_TOKEN_FILE
              value: /var/run/opensphere/provider-dispatch/token
            - name: CONSOLE_PROVIDER_ENGINE_TOKEN_FILE
              value: /var/run/opensphere/provider-engine/token
            - name: CONSOLE_PROVIDER_AUTHORITY_AUDIENCE
              value: opensphere-foundation-authority
            # Y1 (plan §2 ★): C_EXT calls Foundation's lifecycle event API with this token (audience
            # opensphere-foundation-lifecycle). The switch is the provider-lifecycle volume: without it the file is
            # absent and C_EXT keeps the Console ledger path only.
            - name: CONSOLE_PROVIDER_LIFECYCLE_TOKEN_FILE
              value: /var/run/opensphere/provider-lifecycle/token
            # Y1 (plan §2 ★): the OS Shell identities C_EXT renders into the Foundation runtime (owner proof redeem) and
            # PSSS runtime (approval record read) Pods. "off" withholds the token and CA (extension-release.mjs).
            - name: CONSOLE_FOUNDATION_OS_SHELL_OWNER_IDENTITY
              value: 'on'
            - name: CONSOLE_PSSS_OS_SHELL_APPROVAL_IDENTITY
              value: 'on'
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { cpu: 250m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: provider-dispatch
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken: { path: token, audience: opensphere-foundation-dispatch, expirationSeconds: 600 }
        - name: provider-engine
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken: { path: token, audience: opensphere-provider-engine-evidence, expirationSeconds: 600 }
        - name: provider-lifecycle
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken: { path: token, audience: opensphere-foundation-lifecycle, expirationSeconds: 600 }
        - name: module-registry
          secret:
            secretName: opensphere-ghcr-pull
            defaultMode: 292
        - name: module-trust
          configMap:
            name: opensphere-extension-trusted-keys
        - name: installation-policy
          configMap:
            name: opensphere-installation-lock
            optional: true
            items:
              - { key: config.json, path: config.json }
---
apiVersion: v1
kind: Service
metadata:
  name: opensphere-extension-controller
  namespace: opensphere-console
  labels:
    app.kubernetes.io/name: opensphere-extension-controller
    app.kubernetes.io/part-of: opensphere-console
    opensphere.io/component: C_EXT
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opensphere-extension-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensphere-extension-controller-ingress
  namespace: opensphere-console
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opensphere-extension-controller
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opensphere-console-api
        - podSelector:
            matchLabels:
              app: opensphere-console
        # Declared Provider revisions present their projected admission token and a Console proof
        # (POST /api/internal/provider-admit). The label is rendered by this controller only.
        - podSelector:
            matchLabels:
              opensphere.io/provider-admit: "true"
      ports:
        - { protocol: TCP, port: 8080 }

