{
  "apiVersion": "admissionregistration.k8s.io/v1",
  "kind": "ValidatingAdmissionPolicy",
  "metadata": {
    "name": "opensphere-pfss-registration-cext-fence",
    "labels": {
      "opensphere.io/managed-by": "opensphere-platform",
      "opensphere.io/installation-profile": "platform-support-operations-v1"
    }
  },
  "spec": {
    "failurePolicy": "Fail",
    "matchConstraints": {
      "resourceRules": [
        {
          "apiGroups": [
            "plugins.opensphere.io"
          ],
          "apiVersions": [
            "v1alpha1"
          ],
          "operations": [
            "CREATE",
            "UPDATE"
          ],
          "resources": [
            "uipluginregistrations"
          ]
        }
      ]
    },
    "matchConditions": [
      {
        "name": "bounded-runtime-writer",
        "expression": "request.userInfo.username == 'system:serviceaccount:opensphere-console:opensphere-extension-controller' && ((has(object.metadata.labels) && 'opensphere.io/declaration-owner' in object.metadata.labels && object.metadata.labels['opensphere.io/declaration-owner'] == 'Argo') || (request.operation == 'UPDATE' && (has(oldObject.metadata.labels) && 'opensphere.io/declaration-owner' in oldObject.metadata.labels && oldObject.metadata.labels['opensphere.io/declaration-owner'] == 'Argo')))"
      }
    ],
    "validations": [
      {
        "expression": "request.operation == 'UPDATE' && (has(oldObject.metadata.labels) && 'opensphere.io/declaration-owner' in oldObject.metadata.labels && oldObject.metadata.labels['opensphere.io/declaration-owner'] == 'Argo')",
        "message": "C_EXT cannot create an Argo declaration or take over the declaration writer"
      },
      {
        "expression": "object.spec == oldObject.spec && object.metadata.uid == oldObject.metadata.uid",
        "message": "C_EXT cannot mutate an Argo declaration spec or identity"
      },
      {
        "expression": "has(object.metadata.labels) && 'opensphere.io/declaration-owner' in object.metadata.labels && object.metadata.labels['opensphere.io/declaration-owner'] == 'Argo' && (has(object.metadata.annotations) && 'opensphere.io/foundation-registration-uid' in object.metadata.annotations ? object.metadata.annotations['opensphere.io/foundation-registration-uid'] : '') == (has(oldObject.metadata.annotations) && 'opensphere.io/foundation-registration-uid' in oldObject.metadata.annotations ? oldObject.metadata.annotations['opensphere.io/foundation-registration-uid'] : '') && (!has(object.metadata.ownerReferences) || size(object.metadata.ownerReferences) == 0)",
        "message": "C_EXT cannot reclaim declaration ownership or change its logical host"
      }
    ]
  }
}
