  },
  "spec": {
    "failurePolicy": "Fail",
    "paramKind": {
      "apiVersion": "plugins.opensphere.io/v1alpha1",
      "kind": "UIPluginRegistration"
    },
    "matchConstraints": {
      "resourceRules": [
        {
          "apiGroups": [
            "foundation.opensphere.io"
          ],
          "apiVersions": [
            "*"
          ],
          "operations": [
            "CREATE",
            "UPDATE"
          ],
          "resources": [
            "foundationmodels"
          ]
        }
      ]
    },
    "matchConditions": [
      {
        "name": "foundation-identities",
        "expression": "request.userInfo.username in ['system:serviceaccount:opensphere-console:opensphere-foundation-runtime','system:serviceaccount:opensphere-foundation:foundation-control-plane']"
      }
    ],
    "variables": [
      {
        "name": "subject",
        "expression": "request.userInfo.username == 'system:serviceaccount:opensphere-foundation:foundation-control-plane' ? 'controller' : 'runtime'"
      },
      {
        "name": "bootstrap",
        "expression": "variables.subject == 'controller' ? ['identity','search'] : ['identity','data','search']"
      },
      {
        "name": "declared",
        "expression": "has(params.status) && has(params.status.hostPermissions) && has(params.status.hostPermissions.foundationModels) && variables.subject in params.status.hostPermissions.foundationModels ? params.status.hostPermissions.foundationModels[variables.subject] : []"
      }
    ],
    "validations": [
      {
        "expression": "object.metadata.name in variables.bootstrap || object.metadata.name in variables.declared",
        "messageExpression": "'FoundationModel ' + object.metadata.name + ' is not approved for the Foundation ' + variables.subject + ' identity; approve it in the Foundation update plan (hostPermissions.foundationModels)'"
      }
    ]
  }
}
