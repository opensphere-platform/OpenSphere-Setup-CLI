apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensphere-extension-controller
  namespace: opensphere-console
  labels:
    app.kubernetes.io/name: opensphere-extension-controller
    app.kubernetes.io/part-of: opensphere-console
    opensphere.io/component: C_EXT
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensphere-extension-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensphere-extension-controller
        app.kubernetes.io/part-of: opensphere-console
        opensphere.io/component: C_EXT
    spec:
      serviceAccountName: opensphere-extension-controller
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: opensphere-ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: __OPENSPHERE_EXTENSION_CONTROLLER_IMAGE__
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - { name: module-registry, mountPath: /var/run/opensphere/module-registry, readOnly: true }
            - { name: module-trust, mountPath: /var/run/opensphere/module-trust, readOnly: true }
          env:
            - name: CONSOLE_EXTENSION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: opensphere-extension-controller-runtime
                  key: database-url
            - name: CONSOLE_REGISTRY_URL
              value: http://opensphere-registry.opensphere-console.svc.cluster.local:8080
            - name: CONSOLE_EXTENSION_NAMESPACE
              value: opensphere-console
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: CONSOLE_EXTENSION_LIFECYCLE_ENABLED
              value: 'true'
            - name: CONSOLE_OWNER_AUTHORITY_URL
              value: http://opensphere-console-api.opensphere-console.svc.cluster.local:8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { cpu: 250m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: module-registry
          secret:
            secretName: opensphere-ghcr-pull
            defaultMode: 292
        - name: module-trust
          configMap:
            name: opensphere-extension-trusted-keys
---
apiVersion: v1
kind: Service
metadata:
  name: opensphere-extension-controller
  namespace: opensphere-console
  labels:
    app.kubernetes.io/name: opensphere-extension-controller
    app.kubernetes.io/part-of: opensphere-console
    opensphere.io/component: C_EXT
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opensphere-extension-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensphere-extension-controller-ingress
  namespace: opensphere-console
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opensphere-extension-controller
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opensphere-console-api
        - podSelector:
            matchLabels:
              app: opensphere-console
      ports:
        - { protocol: TCP, port: 8080 }

