apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: { name: opensphere-shell-runtime-template-v1 }
spec:
  policyName: opensphere-shell-runtime-template-v1
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels: { opensphere.io/scope: ephemeral-shell-runtime }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: opensphere-shell-api-ingress, namespace: opensphere-console }
spec:
  podSelector: { matchLabels: { app: opensphere-shell-api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: opensphere-console-osaa-gateway } }
        - podSelector: { matchLabels: { app: opensphere-console } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: opensphere-console-api } }
      ports: [{ protocol: TCP, port: 8080 }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: opensphere-shell-sessions } }
          podSelector: { matchLabels: { app: opensphere-os-shell-runtime } }
      ports: [{ protocol: TCP, port: 8443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: opensphere-shell-gateway-ingress, namespace: opensphere-console }
spec:
  podSelector: { matchLabels: { app: opensphere-shell-gateway } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: opensphere-console } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: opensphere-console-api } }
      ports: [{ protocol: TCP, port: 8080 }]
    - from:
        - podSelector: { matchLabels: { app: opensphere-shell-api } }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
