            matchExpressions:
              - { key: app, operator: In, values: [opensphere-shell-api, opensphere-shell-reconciler] }
      ports: [{ protocol: TCP, port: 8443 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: opensphere-console } }
          podSelector: { matchLabels: { app.kubernetes.io/name: opensphere-console-api } }
      # Kubernetes NetworkPolicy is evaluated after Service DNAT by the
      # supported CNI, so authorize the target container port, not Service 8445.
      ports: [{ protocol: TCP, port: 8445 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
