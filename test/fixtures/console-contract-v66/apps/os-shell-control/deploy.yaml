apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: opensphere-shell-api-egress, namespace: opensphere-console }
spec:
  podSelector: { matchLabels: { app: opensphere-shell-api } }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: opensphere-registry } }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/managed-by: opensphere-extension-controller, opensphere.io/command-provider: 'true' } }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - podSelector: { matchLabels: { opensphere.io/extension-id: cluster-manager } }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: opensphere-console-api } }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: opensphere-console-api } }
      ports: [{ protocol: TCP, port: 8444 }]
    - to:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [opensphere-shell-gateway, opensphere-shell-reconciler] }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: opensphere-console-api } }
      ports: [{ protocol: TCP, port: 8445 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: opensphere-console-data } }
          podSelector: { matchLabels: { app: opensphere-supabase-postgres } }
      ports: [{ protocol: TCP, port: 5432 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: opensphere-console-osaa-gateway } }
      ports: [{ protocol: TCP, port: 8080 }]
